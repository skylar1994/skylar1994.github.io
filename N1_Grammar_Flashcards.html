<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N1·N2语法闪卡</title>
<style>
:root{--text:#eaf0ff;--muted:#a9b7d6;--line:rgba(255,255,255,.12);--accent:#7dd3fc;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--codebg:rgba(255,255,255,.06)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#071021,#0b1220);color:var(--text);font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
a,.link{color:var(--accent);text-decoration:none;font-size:13px;cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.box{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);padding:14px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.stats div{border:1px solid var(--line);border-radius:12px;padding:8px 4px;background:rgba(15,27,51,.55)}
.stats b{display:block;font-size:20px;color:var(--accent)}
.btn{font:inherit;font-size:15px;padding:11px 16px;border-radius:12px;border:1px solid rgba(125,211,252,.5);background:rgba(125,211,252,.14);color:var(--text);cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;font-size:13px;padding:6px 12px}
.btn.ghost{background:none;border-color:var(--line);color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:12px}
.cal span{padding:5px 0;border-radius:8px;color:var(--muted)}
.cal .h{color:var(--accent)}
.cal .on{background:rgba(74,222,128,.22);color:var(--ok);font-weight:700}
.cal .miss{opacity:.4}
.cal .td{outline:1px solid var(--accent)}
.cal .fu{opacity:.25}
label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;font-size:14px}
select,input[type=range]{font:inherit;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.fc{border:1px solid rgba(125,211,252,.35);border-radius:18px;background:rgba(15,27,51,.75);padding:22px 18px;min-height:260px;cursor:pointer;position:relative}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid rgba(125,211,252,.45);color:var(--accent)}
.tag.rv{border-color:rgba(251,191,36,.6);color:var(--warn)}
.ft{font-size:28px;font-weight:700;text-align:center;margin:36px 0 12px;line-height:2}
.ft rt,.jp rt{font-weight:400;font-size:.5em;color:var(--accent)}
.nofuri rt{display:none}
.spk{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:1px solid rgba(125,211,252,.45);background:rgba(255,255,255,.06);color:var(--accent);cursor:pointer;font-size:14px;padding:0}
.center{text-align:center}
.mean{font-size:19px;font-weight:700;margin:6px 0}
.ex{background:var(--codebg);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;margin:8px 0}
.ex .j{font-weight:600;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ex .z{color:var(--muted);font-size:13px}
.tip{font-size:13px;color:var(--muted);margin:6px 0}
.smr{font-size:13px;padding:6px 0;border-top:1px dashed var(--line);cursor:pointer}
.smr .cn,.cn{color:var(--muted)}
.smr .arr{color:var(--accent);font-size:11px;margin-left:4px}
.smr .ex{margin:6px 0 2px;cursor:default}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{font:inherit;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;line-height:1.3}
.rate small{display:block;color:var(--muted);font-size:11px}
.r0{border-color:rgba(248,113,113,.6)!important}.r1{border-color:rgba(251,191,36,.6)!important}.r2{border-color:rgba(74,222,128,.6)!important}
.stats .st{cursor:pointer}.stats .st:active{background:rgba(125,211,252,.12)}
.stats small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;background:rgba(15,27,51,.55);cursor:pointer}
.li:active{background:rgba(125,211,252,.12)}
.li .lt{display:flex;flex-direction:column;min-width:0}.li .cn{font-size:12px}
.meta{font-size:12px;color:var(--accent);white-space:nowrap;text-align:right}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:11px 12px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer}
.opt:disabled{cursor:default;color:var(--text)}
.opt.ok{border-color:var(--ok);background:rgba(74,222,128,.16)}.opt.bad{border-color:var(--bad);background:rgba(248,113,113,.16)}
.fb{margin:10px 0;padding:8px 10px;border-radius:10px;font-weight:600}.fb.ok{background:rgba(74,222,128,.14);color:var(--ok)}.fb.bad{background:rgba(248,113,113,.14);color:var(--bad)}
@keyframes inR{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.fc.inR{animation:inR .22s ease}.fc.inL{animation:inL .22s ease}
.kj{font-size:14px;margin:6px 0}.kj b{color:var(--accent);font-weight:600}
.stats .st{font-size:13px}.stats .st b{font-size:18px}
.nw{border-color:rgba(251,191,36,.7)!important;background:rgba(251,191,36,.08)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D={"cards":[{"t":"～に<ruby>値<rt>あたい<\/rt><\/ruby>する","tr":"～にあたいする","cn":"值得……","lv":1,"ex":[{"j":"この映画は見るに値する。","z":"这部电影值得一看。"}],"tip":["有价值 / 值得推荐"],"sim":[1,2],"sm":[423,1,2]},{"t":"～に<ruby>足<rt>た<\/rt><\/ruby>る","tr":"～にたる","cn":"足以……","lv":1,"ex":[{"j":"信頼に足る人物だ。","z":"是个值得信赖的人物。"}],"tip":["正式版：に値する"],"sim":[65,0],"sm":[65,0]},{"t":"～に<ruby>足<rt>た<\/rt><\/ruby>りない","tr":"～にたりない","cn":"不值得……","lv":1,"ex":[{"j":"驚くに足りない。","z":"不值得大惊小怪。"}],"tip":["没什么大不了"],"sim":[0,1],"sm":[0,1]},{"t":"～に<ruby>忍<rt>しの<\/rt><\/ruby>びない","tr":"～にしのびない","cn":"于心不忍","lv":1,"ex":[{"j":"見るに忍びない光景だった。","z":"是让人不忍直视的惨状。"}],"tip":[],"sim":[0,1],"sm":[0,1]},{"t":"～にたえない","tr":"～にたえない","cn":"无法承受","lv":1,"ex":[{"j":"悲しみにたえない。","z":"悲伤得难以承受。"}],"tip":[],"sim":[134,0],"kj":"～に堪えない／～に耐えない","sm":[134,0]},{"t":"～にほかならない","tr":"～にほかならない","cn":"原因只有一个：正是……","lv":1,"ex":[{"j":"成功は努力の結果にほかならない。","z":"成功正是努力的结果，别无其他。"}],"tip":[],"sim":[275,6],"kj":"～に他ならない","sm":[275,6]},{"t":"～にすぎない","tr":"～にすぎない","cn":"不过是……","lv":1,"ex":[{"j":"それは噂にすぎない。","z":"那不过是传闻罢了。"}],"tip":[],"sim":[274,5],"kj":"～に過ぎない","sm":[274,5]},{"t":"～ならでは","tr":"～ならでは","cn":"只有……才能……","lv":1,"ex":[{"j":"京都ならではの景色。","z":"只有京都才有的风景。"}],"tip":["独一无二"],"sim":[332,5],"sm":[332,5]},{"t":"～まみれ","tr":"～まみれ","cn":"全是……","lv":1,"ex":[{"j":"泥まみれになった。","z":"浑身沾满了泥。"}],"tip":[],"sim":[5,6],"kj":"～塗れ","sm":[5,6]},{"t":"～ずくめ","tr":"～ずくめ","cn":"全都是好事/清一色 / 全都是……","lv":1,"ex":[{"j":"黒ずくめの男。","z":"浑身黑衣打扮的男人。"},{"j":"良いことずくめ。","z":"尽是好事，好事连连。"}],"tip":[],"sim":[5,6],"kj":"～尽くめ","sm":[5,6]},{"t":"～ぐるみ","tr":"～ぐるみ","cn":"包括……在内 / 全体……","lv":1,"ex":[{"j":"町ぐるみで観光客を歓迎する。","z":"全城齐心协力欢迎游客。"}],"tip":["接名词，表示把某个整体（家族、地区、组织等）全部卷入或包括在内"],"sim":[5,6],"sm":[5,6]},{"t":"～からすると","tr":"～からすると","cn":"从……来看","lv":1,"ex":[{"j":"表情からすると、怒っているようだ。","z":"从表情来看，他好像在生气。"}],"tip":[],"sim":[202,12],"sm":[202,12]},{"t":"～からいえば","tr":"～からいえば","cn":"按……来说","lv":1,"ex":[{"j":"経験からいえば、難しい。","z":"从经验来说，这很难。"}],"tip":[],"sim":[11,13],"kj":"～から言えば","sm":[385,11,13]},{"t":"～に<ruby <div class="row" style="margin-top:12px"><button class="btn sm ghost" data-a="hd">${S.hard[id]?'🚩 已标难点（点击取消）':'⚑ 标为难点'}</button>${nav?`<span><button class="btn sm ghost" data-a="prev" ${idx<=0?'disabled':''}>← 上一个</button> <button class="btn sm ghost" data-a="next" ${idx>=listIds.length-1?'disabled':''}>下一个 →</button></span>`:''}</div>`}
function undo(){if(!last)return;const id=last.id;if(last.prev)S.c[id]=last.prev;else delete S.c[id];if(last.hard)S.hard[id]=1;else delete S.hard[id];S.plan.seen=last.seen;Q=last.Q;done=last.done;total=last.total;again=new Set(last.again);last=null;save();flipped=false;view='study';render()}
function begin(m){mode=m||'daily';justCI=false;last=null;xs.clear();Q=mode==='hard'?Object.keys(S.hard).map(Number):[...dueList(),...newList()];const hs=i=>S.hard[i]?0:1;Q.sort((a,b)=>hs(a)-hs(b)||pos[a]-pos[b]);total=Q.length;done=0;again.clear();flipped=false;view=Q.length?'study':'home';render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='sp'){e.stopPropagation();const c=D.cards[view==='detail'?det:view==='quiz'?qcur:Q[0]];speak(b.dataset.e==='t'?say(c):exSay(c,c.ex[+b.dataset.e].j.replace(/^[A-ZＡ-Ｚa-z]：/,'')));return}
 if(a==='ci'){if(!clockBack&&!S.ci.includes(T)){S.ci.push(T);save();render()}}
 else if(a==='go')begin();
 else if(a==='test')speak('今日は、いい天気ですね。')
 else if(a==='gohard')begin('hard');
 else if(a==='learnadded')learnAdded();
 else if(a==='snz'){S.snz=T;save();render()}
 else if(a==='cmp'){cmpFrom=view;cmpId=+b.dataset.id;view='cmp';window.scrollTo(0,0);render()}
 else if(a==='cback'){view=cmpFrom||'home';window.scrollTo(0,0);render()}
 else if(a==='grp'){grpFrom=view;grpIdx=+b.dataset.g;view='group';window.scrollTo(0,0);render()}
 else if(a==='gback'){view=grpFrom||'home';window.scrollTo(0,0);render()}
 else if(a==='spt'){e.stopPropagation();speak(say(D.cards[+b.dataset.j]))}
 else if(a==='seen')seen();
 else if(a==='quiz')startQuiz();
 else if(a==='ans')answer(+b.dataset.id);
 else if(a==='qnext')qnext();
 else if(a==='skip')skip();
 else if(a==='list'){listKey=b.dataset.k;listIds=items(listKey);view='list';window.scrollTo(0,0);render()}
 else if(a==='det'){if(b.dataset.from==='sim')hist.push(det);else hist=[];det=+b.dataset.id;xs.clear();view='detail';window.scrollTo(0,0);render()}
 else if(a==='lst'){xs.clear();if(hist.length)det=hist.pop();else view='list';window.scrollTo(0,0);render()}
 else if(a==='prev'||a==='next')goCard(a==='next'?1:-1);
 else if(a==='hd'){const id=view==='detail'?det:Q[0];if(S.hard[id])delete S.hard[id];else{S.hard[id]=1;const c=S.c[id];if(c){c.ok=0;if(c.due>addDays(T,1))c.due=addDays(T,1)}}save();render()}
 else if(a==='more'){S.plan.ids=S.plan.ids.concat(pending().slice(0,S.cfg.n));save();begin()}
 else if(a==='home'){view='home';render()}
 else if(a==='flip'){if(!flipped){flipped=true;render();if(S.cfg.auto){const o=D.cards[Q[0]];speak(exSay(o,o.ex[0].j.split('\n')[0]))}}}
 else if(a==='xs'){const j=+b.dataset.j;xs.has(j)?xs.delete(j):xs.add(j);render()}
 else if(a==='sp2'){e.stopPropagation();{const o=D.cards[+b.dataset.j];speak(exSay(o,o.ex[+(b.dataset.k||0)].j.split('\n')[0]))}}
 else if(a==='undo')undo();
 else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='n1-flashcards-'+T+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
 else if(a==='imp')document.getElementById('impf').click();
 else if(a==='nop'){}
 else if(a==='r')rate(+b.dataset.q);
 else if(a==='reset'&&confirm('确定清空全部学习进度和签到记录？')){S={cfg:S.cfg,c:{},hard:{},plan:null,ci:[],last:T};S.plan={d:T,ids:pending().slice(0,S.cfg.n),seen:[]};save();render()}});
document.addEventListener('change',e=>{if(e.target.id==='impf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.c||!x.ci)throw 0;if(confirm('导入将覆盖当前进度，继续？')){S=Object.assign({cfg:S.cfg,c:{},hard:{},plan:null,ci:[],last:T},x);S.last=T;S.plan={d:T,ids:pending().slice(0,S.cfg.n),seen:[]};save();render()}}catch(_){alert('文件格式不正确')}};r.readAsText(f);return}
const k=e.target.dataset.s;if(!k)return;
 if(/^lv[12]$/.test(k)){const l=+k[2],set=new Set(S.cfg.lvs);e.target.checked?set.add(l):set.delete(l);if(!set.size){render();return}S.cfg.lvs=[...set].sort();const keep=S.plan.ids.filter(i=>S.c[i]||S.plan.seen.includes(i));S.plan.ids=[...keep,...pending().filter(i=>!keep.includes(i)&&!S.plan.seen.includes(i)).slice(0,Math.max(0,S.cfg.n-keep.length))];save();render();return}
 S.cfg[k]=(k==='furi'||k==='auto')?e.target.checked:k==='voice'?e.target.value:+e.target.value;save();render()});
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{const p=e.touches[0];tx=p.clientX;ty=p.clientY;tt=Date.now()},{passive:true});
document.addEventListener('touchend',e=>{if(view!=='detail')return;const p=e.changedTouches[0],dx=p.clientX-tx,dy=p.clientY-ty;
 if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)&&Date.now()-tt<800)goCard(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(view==='detail'){if(e.key==='ArrowRight')goCard(1);else if(e.key==='ArrowLeft')goCard(-1);return}if(view==='quiz'){if(qsel===null&&'1234'.includes(e.key)&&qopts[+e.key-1]!==undefined)answer(qopts[+e.key-1]);else if(qsel!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();qnext()}return}if(view!=='study')return;if(e.key===' '){e.preventDefault();flipped=!flipped;render()}else if(e.key==='z'||e.key==='Z')undo();else if(flipped&&'123'.includes(e.key))rate(+e.key-1)});
render();
</script>
</body>
</html>
