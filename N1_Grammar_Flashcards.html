<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N1语法闪卡</title>
<style>
:root{--text:#eaf0ff;--muted:#a9b7d6;--line:rgba(255,255,255,.12);--accent:#7dd3fc;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--codebg:rgba(255,255,255,.06)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#071021,#0b1220);color:var(--text);font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
a,.link{color:var(--accent);text-decoration:none;font-size:13px;cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.box{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);padding:14px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.stats div{border:1px solid var(--line);border-radius:12px;padding:8px 4px;background:rgba(15,27,51,.55)}
.stats b{display:block;font-size:20px;color:var(--accent)}
.btn{font:inherit;font-size:15px;padding:11px 16px;border-radius:12px;border:1px solid rgba(125,211,252,.5);background:rgba(125,211,252,.14);color:var(--text);cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;font-size:13px;padding:6px 12px}
.btn.ghost{background:none;border-color:var(--line);color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:12px}
.cal span{padding:5px 0;border-radius:8px;color:var(--muted)}
.cal .h{color:var(--accent)}
.cal .on{background:rgba(74,222,128,.22);color:var(--ok);font-weight:700}
.cal .miss{opacity:.4}
.cal .td{outline:1px solid var(--accent)}
.cal .fu{opacity:.25}
label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;font-size:14px}
select,input[type=range]{font:inherit;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.fc{border:1px solid rgba(125,211,252,.35);border-radius:18px;background:rgba(15,27,51,.75);padding:22px 18px;min-height:260px;cursor:pointer;position:relative}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid rgba(125,211,252,.45);color:var(--accent)}
.tag.rv{border-color:rgba(251,191,36,.6);color:var(--warn)}
.ft{font-size:28px;font-weight:700;text-align:center;margin:36px 0 12px;line-height:2}
.ft rt,.jp rt{font-weight:400;font-size:.5em;color:var(--accent)}
.nofuri rt{display:none}
.spk{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:1px solid rgba(125,211,252,.45);background:rgba(255,255,255,.06);color:var(--accent);cursor:pointer;font-size:14px;padding:0}
.center{text-align:center}
.mean{font-size:19px;font-weight:700;margin:6px 0}
.ex{background:var(--codebg);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;margin:8px 0}
.ex .j{font-weight:600;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ex .z{color:var(--muted);font-size:13px}
.tip{font-size:13px;color:var(--muted);margin:6px 0}
.smr{font-size:13px;padding:6px 0;border-top:1px dashed var(--line);cursor:pointer}
.smr .cn,.cn{color:var(--muted)}
.smr .arr{color:var(--accent);font-size:11px;margin-left:4px}
.smr .ex{margin:6px 0 2px;cursor:default}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{font:inherit;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;line-height:1.3}
.rate small{display:block;color:var(--muted);font-size:11px}
.r0{border-color:rgba(248,113,113,.6)!important}.r1{border-color:rgba(251,191,36,.6)!important}.r2{border-color:rgba(74,222,128,.6)!important}
.stats .st{cursor:pointer}.stats .st:active{background:rgba(125,211,252,.12)}
.stats small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;background:rgba(15,27,51,.55);cursor:pointer}
.li:active{background:rgba(125,211,252,.12)}
.li .lt{display:flex;flex-direction:column;min-width:0}.li .cn{font-size:12px}
.meta{font-size:12px;color:var(--accent);white-space:nowrap;text-align:right}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:11px 12px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer}
.opt:disabled{cursor:default;color:var(--text)}
.opt.ok{border-color:var(--ok);background:rgba(74,222,128,.16)}.opt.bad{border-color:var(--bad);background:rgba(248,113,113,.16)}
.fb{margin:10px 0;padding:8px 10px;border-radius:10px;font-weight:600}.fb.ok{background:rgba(74,222,128,.14);color:var(--ok)}.fb.bad{background:rgba(248,113,113,.14);color:var(--bad)}
@keyframes inR{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.fc.inR{animation:inR .22s ease}.fc.inL{animation:inL .22s ease}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const D={"cards":[{"t":"～に<ruby>値<rt>あたい<\/rt><\/ruby>する","tr":"～にあたいする","cn":"值得……","lv":1,"ex":[{"j":"この映画は見るに値する。","z":"这部电影值得一看。"}],"tip":["有价值 / 值得推荐"],"sim":[1,2]},{"t":"～に<ruby>足<rt>た<\/rt><\/ruby>る","tr":"～にたる","cn":"足以……","lv":1,"ex":[{"j":"信頼に足る人物だ。","z":"是个值得信赖的人物。"}],"tip":["正式版：に値する"],"sim":[65,0]},{"t":"～に<ruby>足<rt>た<\/rt><\/ruby>りない","tr":"～にたりない","cn":"不值得……","lv":1,"ex":[{"j":"驚くに足りない。","z":"不值得大惊小怪。"}],"tip":["没什么大不了"],"sim":[103,0]},{"t":"～に<ruby>忍<rt>しの<\/rt><\/ruby>びない","tr":"～にしのびない","cn":"于心不忍","lv":1,"ex":[{"j":"見るに忍びない光景だった。","z":"是让人不忍直视的惨状。"}],"tip":[],"sim":[0,1]},{"t":"～にたえない","tr":"～にたえない","cn":"无法承受","lv":1,"ex":[{"j":"悲しみにたえない。","z":"悲伤得难以承受。"}],"tip":[],"sim":[134,27,98]},{"t":"～にほかならない","tr":"～にほかならない","cn":"原因只有一个：正是……","lv":1,"ex":[{"j":"成功は努力の結果にほかならない。","z":"成功正是努力的结果，别无其他。"}],"tip":[],"sim":[275,221,266]},{"t":"～にすぎない","tr":"～にすぎない","cn":"不过是……","lv":1,"ex":[{"j":"それは噂にすぎない。","z":"那不过是传闻罢了。"}],"tip":[],"sim":[274,5]},{"t":"～ならでは","tr":"～ならでは","cn":"只有……才能……","lv":1,"ex":[{"j":"京都ならではの景色。","z":"只有京都才有的风景。"}],"tip":["独一无二"],"sim":[5,6]},{"t":"～まみれ","tr":"～まみれ","cn":"全是……","lv":1,"ex":[{"j":"泥まみれになった。","z":"浑身沾满了泥。"}],"tip":[],"sim":[5,6]},{"t":"～ずくめ","tr":"～ずくめ","cn":"全都是好事/清一色 / 全都是……","lv":1,"ex":[{"j":"黒ずくめの男。","z":"浑身黑衣打扮的男人。"},{"j":"良いことずくめ。","z":"尽是好事，好事连连。"}],"tip":[],"sim":[5,6]},{"t":"～ぐるみ","tr":"～ぐるみ","cn":"包括……在内 / 全体……","lv":1,"ex":[{"j":"町ぐるみで観光客を歓迎する。","z":"全城齐心协力欢迎游客。"}],"tip":["接名词，表示把某个整体（家族、地区、组织等）全部卷入或包括在内"],"sim":[5,6]},{"t":"～からすると","tr":"～からすると","cn":"从……来看","lv":1,"ex":[{"j":"表情からすると、怒っているようだ。","z":"从表情来看，他好像在生气。"}],"tip":[],"sim":[202,12]},{"t":"～からいえば","tr":"～からいえば","cn":"按……来说","lv":1,"ex":[{"j":"経験からいえば、難しい。","z":"从经验来说，这很难。"}],"tip":[],"sim":[11,13]},{"t":"～に<ruby>即<rt>そく<\/rt><\/ruby>して","tr":"～にそくして","cn":"依据……","lv":1,"ex":[{"j":"現状に即して考える。","z":"结合现状来考虑。"}],"tip":[],"sim":[67,128]},{"t":"～に<ruby>沿<rt>そ<\/rt><\/ruby>って","tr":"～にそって","cn":"沿着……","lv":1,"ex":[{"j":"計画に沿って進める。","z":"按照计划推进。"}],"tip":[  const canMore=pending().length>0;
 return `<div class="top"><h1>🃏 N1语法闪卡</h1><a href="index.html">← 语法总览</a></div>
<div class="box"><div class="row"><div><h3>📅 每日签到</h3><div class="muted">🔥 连续 ${streak()} 天 · 累计 ${S.ci.length} 天</div></div>
<span class="tag ${ci?'':'rv'}">${ci?'今日已签到 ✓':'学完自动签到'}</span></div>
<div class="cal">${calendar()}</div>
<div class="muted" style="margin-top:8px">${clockBack?'⚠️ 检测到系统时间被回调，暂不可签到。':'学完今日全部卡片（复习+新学，跳过也算过完一遍）后自动签到；过期不可补签。'}</div></div>
${justCI?'<div class="box center">🎉 今日任务完成，已自动签到！</div>':''}<div class="stats" style="grid-template-columns:repeat(4,1fr)"><div class="st" data-a="list" data-k="due"><b>${due}</b>待复习<small>计划中 ${pool}</small></div><div class="st" data-a="list" data-k="new"><b>${nw}</b>今日新学<small>已练习 ${dt}/${pt}</small></div><div class="st" data-a="list" data-k="hard"><b>${hc}</b>🚩难点<small>点击查看</small></div><div class="st" data-a="list" data-k="learned"><b>${learned}</b>已学<small>共 ${totalOn}</small></div></div>
<div class="muted" style="margin:-4px 0 10px;text-align:center">明日复习 ${tom} 张 · 已掌握 ${mast} 张 · 点上面的数字可查看列表</div>
${due+nw?`<button class="btn" data-a="go">开始学习（复习 ${due} + 新学 ${nw}）</button>`:qn?'':'<button class="btn" data-a="go" disabled>🎉 今日任务已完成</button>'}
${qn?`<button class="btn ${due+nw?'ghost':''}" style="margin-top:8px" data-a="quiz">📝 今日练习（${qn} 题：看词选意）</button>`:''}
${due+nw+qn===0&&canMore?`<button class="btn ghost" style="margin-top:8px" data-a="more">再学一组新语法（${Math.min(S.cfg.n,pending().length)}个）</button>`:''}
${hc?`<button class="btn ghost" style="margin-top:8px" data-a="gohard">🚩 只练难点（${hc}）</button>`:''}
<div class="box" style="margin-top:12px"><h3>⚙️ 设置</h3>
<label>每日新学语法数<select data-s="n">${[5,10,15,20].map(n=>`<option ${n===S.cfg.n?'selected':''}>${n}</option>`).join('')}</select></label>
<label>朗读声音<span><select data-s="voice" style="max-width:190px"><option value="">自动（推荐）</option>${voices.map(v=>`<option value="${esc(v.name)}" ${v.name===S.cfg.voice?'selected':''}>${esc(v.name)}</option>`).join('')}</select> <button class="btn sm ghost" data-a="test">试听</button></span></label>
<label>显示注音<input type="checkbox" data-s="furi" ${S.cfg.furi?'checked':''}></label>
<label>翻面后自动朗读第一个例句<input type="checkbox" data-s="auto" ${S.cfg.auto?'checked':''}></label>
<label>语速 ${S.cfg.rate}<input type="range" min=".5" max="1.1" step=".05" value="${S.cfg.rate}" data-s="rate"></label>
<div class="muted">复习间隔（记忆曲线）：1 → 2 → 4 → 7 → 15 → 30 → 60 天；忘记则回到 1 天。🚩难点：选“忘了”或手动标记后，次日必出现；之后“记得”“模糊”都算 1 次复习，累计 5 次才毕业，间隔逐步拉长（记得 2→4→7→14 天，模糊更短 1→2→4→7 天），中途“忘了”则重新计数。学不动的卡点“跳过”，下次还会再出现。新语法先逐张看完，再做「看词选意」练习：选对进入待复习（明天复习），选错自动标为难点。改动“每日数量”从明天起生效。相似的语法排在同一天学习。</div>
<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ghost" data-a="exp">导出进度</button><button class="btn sm ghost" data-a="imp">导入进度</button><button class="btn sm ghost" data-a="reset">重置全部进度</button></div><input type="file" id="impf" accept=".json" hidden></div>`}
const ctrlHtml=id=>`<div class="row" style="margin-top:12px"><button class="btn sm ghost" data-a="hd">${S.hard[id]?'🚩 已标难点（点击取消）':'⚑ 标为难点'}</button><button class="btn sm ghost" data-a="skip">⏭ 跳过，下次再学</button></div>`;
function backHtml(c,canOpen){let h=`<div class="center muted">${esc(c.tr)}</div><hr style="border:0;border-top:1px solid var(--line)"><div class="mean center">${esc(c.cn)}</div>`;
 c.ex.forEach((e,k)=>{h+=`<div class="ex"><div class="j"><span>${esc(e.j).replace(/\n/g,'<br>')}</span><button class="spk" data-a="sp" data-e="${k}">🔊</button></div><div class="z">${esc(e.z)}</div></div>`});
 c.tip.forEach(t=>h+=`<div class="tip">🧠 ${esc(t)}</div>`);
 if(c.sim.length)h+=`<div class="tip" style="margin-top:12px">🔍 易混对比</div>`+c.sim.map(j=>{const o=D.cards[j],op=xs.has(j);return `<div class="smr" data-a="xs" data-j="${j}"><span class="tag" style="margin-right:4px">N${o.lv}</span><span class="jp">${o.t}</span> <span class="cn">${esc(o.cn)}</span><span class="arr">${op?'▲':'▼'}</span>${op?`<div class="ex" data-a="nop"><div class="j"><span>${esc(o.ex[0].j).replace(/\n/g,'<br>')}</span><button class="spk" data-a="sp2" data-j="${j}">🔊</button></div><div class="z">${esc(o.ex[0].z)}</div>${canOpen&&o.lv===1?`<button class="link" data-a="det" data-id="${j}" data-from="sim" style="margin-top:4px">打开这张卡 →</button>`:''}</div>`:''}</div>`}).join('');
 return h}
function study(){const id=Q[0],c=D.cards[id],isNew=!S.c[id],pct=total?Math.round(done/total*100):0;
 let h=`<div class="top"><button class="link" data-a="home">← 返回</button>${last?'<button class="link" data-a="undo">↩ 撤销</button>':''}<div class="bar"><i style="width:${pct}%"></i></div><span class="muted">${done}/${total}</span></div>
<div class="fc" data-a="flip"><div class="row"><span><span class="tag ${isNew?'':'rv'}">${isNew?'新学':'复习'}</span>${S.hard[id]?' <span class="tag rv">🚩难点 '+((S.c[id]&&S.c[id].ok)||0)+'/5</span>':''}</span><button class="spk" data-a="sp" data-e="t">🔊</button></div>
<div class="ft">${c.t}</div>`;
 const ctrl=ctrlHtml(id);
 if(!flipped)return h+`<div class="center muted">点击卡片查看释义与例句</div></div>`+ctrl;
 h+=backHtml(c,false);
 h+=isNew?`</div><div class="rate" style="grid-template-columns:1fr"><button class="r2" data-a="seen">✅ 看完了，下一个<small>全部看完后统一做选择题练习</small></button></div>`+ctrl:`</div><div class="rate">`+[['忘了','r0'],['模糊','r1'],['记得','r2']].map((x,q)=>`<button class="${x[1]}" data-a="r" data-q="${q}">${x[0]}<small>${label(id,q)}</small></button>`).join('')+'</div>'+ctrl;
 return h}
const dueLbl=i=>{const c=S.c[i];if(!c)return '';const n=Math.round((new Date(c.due)-new Date(T))/864e5);return n<=0?'今天复习':n===1?'明天复习':n+'天后复习'};
const okOf=i=>(S.c[i]&&S.c[i].ok)||0;
function items(k){
 if(k==='due')return Object.keys(S.c).map(Number).sort((a,b)=>S.c[a].due.localeCompare(S.c[b].due)||pos[a]-pos[b]);
 if(k==='new')return [...S.plan.ids];
 if(k==='hard')return Object.keys(S.hard).map(Number).sort((a,b)=>pos[a]-pos[b]);
 return Object.keys(S.c).map(Number).sort((a,b)=>pos[a]-pos[b])}
const LT={due:'待复习',new:'今日新学',hard:'🚩难点',learned:'已学语法'};
function meta(k,i){const s=S.c[i];
 if(k==='new')return s?'✓ 已学':S.plan.seen.includes(i)?'待练习':'待学';
 if(k==='hard')return '🚩'+okOf(i)+'/5'+(s?'<br>'+dueLbl(i):'');
 if(k==='learned')return (S.hard[i]?'🚩 ':'')+'<br>'+dueLbl(i);
 return (S.hard[i]?'🚩'+okOf(i)+'/5<br>':'')+dueLbl(i)}
function listView(){const ids=listIds;let h=`<div class="top"><button class="link" data-a="home">← 返回</button><h1 style="font-size:18px">${LT[listKey]}（${ids.length}）</h1><span></span></div>`;
 if(listKey==='due'){const tm=addDays(T,1);const nd=ids.filter(i=>S.c[i].due<=T).length;h+=`<div class="muted" style="margin-bottom:6px">今天需复习 ${nd} 张；其余是已排期的语法（包括今天刚学完的），到期后自动进入复习。</div>`}
 if(listKey==='new')h+=`<div class="muted" style="margin-bottom:6px">今天的语法列表，已学完的会自动进入「待复习」排期。</div>`;
 if(!ids.length)return h+'<div class="box center muted">还没有内容</div>';
 let g=-1;const tm=addDays(T,1);
 ids.forEach(i=>{if(listKey==='due'){const d=S.c[i].due,n=d<=T?0:d===tm?1:2;if(n!==g){g=n;h+=`<div class="tip" style="margin-top:10px">${['今天需复习','明天复习','之后'][n]}</div>`}}
  const c=D.cards[i];h+=`<div class="li" data-a="det" data-id="${i}"><div class="lt"><span class="jp">${c.t}</span><span class="cn">${esc(c.cn)}</span></div><span class="meta">${meta(listKey,i)}</span></div>`});
 return h}
function goCard(d){if(view!=='detail'||hist.length)return;const k=listIds.indexOf(det)+d;if(k>=0&&k<listIds.length){det=listIds[k];swDir=d;xs.clear();window.scrollTo(0,0);render()}}
function detail(){const id=det,c=D.cards[id],s=S.c[id],idx=listIds.indexOf(id),nav=idx>=0&&!hist.length,anim=swDir>0?'inR':swDir<0?'inL':'';swDir=0;
 return `<div class="top"><button class="link" data-a="lst">← 返回${hist.length?'上一张':'列表'}</button><span class="muted">${nav?'← 左右滑动切换 → '+(idx+1)+' / '+listIds.length:''}</span></div>
<div class="fc ${anim}" style="cursor:default"><div class="row"><span>${s?'<span class="tag rv">'+dueLbl(id)+'</span>':'<span class="tag">未学</span>'}${S.hard[id]?' <span class="tag rv">🚩难点 '+okOf(id)+'/5</span>':''}</span><button class="spk" data-a="sp" data-e="t">🔊</button></div>
<div class="ft">${c.t}</div>${backHtml(c,true)}</div>
<div class="row" style="margin-top:12px"><button class="btn sm ghost" data-a="hd">${S.hard[id]?'🚩 已标难点（点击取消）':'⚑ 标为难点'}</button>${nav?`<span><button class="btn sm ghost" data-a="prev" ${idx<=0?'disabled':''}>← 上一个</button> <button class="btn sm ghost" data-a="next" ${idx>=listIds.length-1?'disabled':''}>下一个 →</button></span>`:''}</div>`}
function undo(){if(!last)return;const id=last.id;if(last.prev)S.c[id]=last.prev;else delete S.c[id];if(last.hard)S.hard[id]=1;else delete S.hard[id];S.plan.seen=last.seen;Q=last.Q;done=last.done;total=last.total;again=new Set(last.again);last=null;save();flipped=false;view='study';render()}
function begin(m){mode=m||'daily';justCI=false;last=null;xs.clear();Q=mode==='hard'?Object.keys(S.hard).map(Number):[...dueList(),...newList()];const hs=i=>S.hard[i]?0:1;Q.sort((a,b)=>hs(a)-hs(b)||pos[a]-pos[b]);total=Q.length;done=0;again.clear();flipped=false;view=Q.length?'study':'home';render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='sp'){e.stopPropagation();const c=D.cards[view==='detail'?det:view==='quiz'?qcur:Q[0]];speak(b.dataset.e==='t'?say(c):c.ex[+b.dataset.e].j.replace(/^[A-ZＡ-Ｚa-z]：/,''));return}
 if(a==='ci'){if(!clockBack&&!S.ci.includes(T)){S.ci.push(T);save();render()}}
 else if(a==='go')begin();
 else if(a==='test')speak('今日は、いい天気ですね。')
 else if(a==='gohard')begin('hard');
 else if(a==='seen')seen();
 else if(a==='quiz')startQuiz();
 else if(a==='ans')answer(+b.dataset.id);
 else if(a==='qnext')qnext();
 else if(a==='skip')skip();
 else if(a==='list'){listKey=b.dataset.k;listIds=items(listKey);view='list';window.scrollTo(0,0);render()}
 else if(a==='det'){if(b.dataset.from==='sim')hist.push(det);else hist=[];det=+b.dataset.id;xs.clear();view='detail';window.scrollTo(0,0);render()}
 else if(a==='lst'){xs.clear();if(hist.length)det=hist.pop();else view='list';window.scrollTo(0,0);render()}
 else if(a==='prev'||a==='next')goCard(a==='next'?1:-1);
 else if(a==='hd'){const id=view==='detail'?det:Q[0];if(S.hard[id])delete S.hard[id];else{S.hard[id]=1;const c=S.c[id];if(c){c.ok=0;if(c.due>addDays(T,1))c.due=addDays(T,1)}}save();render()}
 else if(a==='more'){S.plan.ids=S.plan.ids.concat(pending().slice(0,S.cfg.n));save();begin()}
 else if(a==='home'){view='home';render()}
 else if(a==='flip'){if(!flipped){flipped=true;render();if(S.cfg.auto)speak(D.cards[Q[0]].ex[0].j.split('\n')[0])}}
 else if(a==='xs'){const j=+b.dataset.j;xs.has(j)?xs.delete(j):xs.add(j);render()}
 else if(a==='sp2'){e.stopPropagation();speak(D.cards[+b.dataset.j].ex[0].j.split('\n')[0])}
 else if(a==='undo')undo();
 else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='n1-flashcards-'+T+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
 else if(a==='imp')document.getElementById('impf').click();
 else if(a==='nop'){}
 else if(a==='r')rate(+b.dataset.q);
 else if(a==='reset'&&confirm('确定清空全部学习进度和签到记录？')){S={cfg:S.cfg,c:{},hard:{},plan:null,ci:[],last:T};S.plan={d:T,ids:pending().slice(0,S.cfg.n),seen:[]};save();render()}});
document.addEventListener('change',e=>{if(e.target.id==='impf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.c||!x.ci)throw 0;if(confirm('导入将覆盖当前进度，继续？')){S=Object.assign({cfg:S.cfg,c:{},hard:{},plan:null,ci:[],last:T},x);S.last=T;S.plan={d:T,ids:pending().slice(0,S.cfg.n),seen:[]};save();render()}}catch(_){alert('文件格式不正确')}};r.readAsText(f);return}
const k=e.target.dataset.s;if(!k)return;
 if(/^lv[123]$/.test(k)){const l=+k[2],set=new Set(S.cfg.lv);e.target.checked?set.add(l):set.delete(l);if(!set.size){render();return}S.cfg.lv=[...set].sort();S.plan={d:T,ids:pending().slice(0,S.cfg.n),seen:[]};save();render();return}
 S.cfg[k]=(k==='furi'||k==='auto')?e.target.checked:k==='voice'?e.target.value:+e.target.value;save();render()});
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{const p=e.touches[0];tx=p.clientX;ty=p.clientY;tt=Date.now()},{passive:true});
document.addEventListener('touchend',e=>{if(view!=='detail')return;const p=e.changedTouches[0],dx=p.clientX-tx,dy=p.clientY-ty;
 if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)&&Date.now()-tt<800)goCard(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(view==='detail'){if(e.key==='ArrowRight')goCard(1);else if(e.key==='ArrowLeft')goCard(-1);return}if(view==='quiz'){if(qsel===null&&'1234'.includes(e.key)&&qopts[+e.key-1]!==undefined)answer(qopts[+e.key-1]);else if(qsel!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();qnext()}return}if(view!=='study')return;if(e.key===' '){e.preventDefault();flipped=!flipped;render()}else if(e.key==='z'||e.key==='Z')undo();else if(flipped&&'123'.includes(e.key))rate(+e.key-1)});
render();
</script>
</body>
</html>
