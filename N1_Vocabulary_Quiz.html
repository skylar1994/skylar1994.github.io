<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N1 词汇特训 · 50题</title>
<style>
  :root{
    --bg:#12141a;
    --panel:#1a1d26;
    --panel-2:#20232e;
    --border:#2c303c;
    --text:#e8e9ee;
    --text-dim:#9aa0ae;
    --accent:#6ea8fe;
    --accent-dim:#3a4b6b;
    --correct:#3fbf7f;
    --correct-bg:#123023;
    --wrong:#e5566d;
    --wrong-bg:#301418;
    --unanswered:#3a3e4c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 100px;}
  header{
    text-align:center;
    padding:10px 0 18px;
  }
  header h1{
    font-size:20px;
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:13px;
  }
  .progress-bar{
    height:6px;
    border-radius:3px;
    background:var(--panel-2);
    overflow:hidden;
    margin:14px 0 4px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),#8fd3ff);
    transition:width .25s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px 20px;
    margin-top:14px;
  }
  .q-index{
    font-size:12px;
    color:var(--accent);
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:8px;
  }
  .q-sentence{
    font-size:19px;
    line-height:1.9;
    margin:6px 0 20px;
  }
  .blank{
    display:inline-block;
    min-width:64px;
    border-bottom:2px solid var(--text-dim);
    text-align:center;
  }
  .blank.filled{
    color:var(--accent);
    border-color:var(--accent);
    font-weight:600;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:baseline;
    gap:10px;
    text-align:left;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover:not(.locked){
    border-color:var(--accent);
  }
  .opt .label{
    font-size:12px;
    color:var(--text-dim);
    flex-shrink:0;
  }
  .opt .kanji{font-weight:600;}
  .opt .reading{color:var(--text-dim);font-size:13px;}
  .opt.correct{
    background:var(--correct-bg);
    border-color:var(--correct);
  }
  .opt.wrong{
    background:var(--wrong-bg);
    border-color:var(--wrong);
  }
  .opt.locked{cursor:default;}

  .explain{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .explain.show{display:block;}
  .explain .result-tag{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    padding:3px 10px;
    border-radius:6px;
    margin-bottom:12px;
  }
  .result-tag.ok{background:var(--correct-bg);color:var(--correct);}
  .result-tag.no{background:var(--wrong-bg);color:var(--wrong);}
  .opt-explain{
    font-size:13.5px;
    line-height:1.7;
    color:var(--text-dim);
    margin:4px 0;
  }
  .opt-explain b{color:var(--text);}
  .opt-explain.is-answer b{color:var(--correct);}
  .translation{
    margin-top:14px;
    padding:12px 14px;
    background:var(--panel-2);
    border-radius:10px;
    font-size:14px;
    line-height:1.8;
    color:var(--text);
  }
  .translation .tlabel{
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:1px;
    display:block;
    margin-bottom:4px;
  }

  .nav-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:14px;
    cursor:pointer;
    font-weight:600;
  }
  .nav-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .nav-btn.primary{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:#dfeaff;
  }

  .sheet-toggle{
    text-align:center;
    margin-top:22px;
  }
  .sheet-toggle button{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
  }

  .answer-sheet{
    margin-top:14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    display:none;
  }
  .answer-sheet.show{display:block;}
  .sheet-title{
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sheet-legend{
    display:flex;
    gap:12px;
    font-size:11px;
    color:var(--text-dim);
  }
  .sheet-legend span{display:flex;align-items:center;gap:4px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.ok{background:var(--correct);}
  .dot.no{background:var(--wrong);}
  .dot.un{background:var(--unanswered);}

  .sheet-grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:8px;
    margin-top:10px;
    max-height:340px;
    overflow-y:auto;
    padding-right:4px;
  }
  .sheet-cell{
    aspect-ratio:1;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:600;
  }
  .sheet-cell.current{
    border-color:var(--accent);
    color:var(--accent);
  }
  .sheet-cell.ok{
    background:var(--correct-bg);
    border-color:var(--correct);
    color:var(--correct);
  }
  .sheet-cell.no{
    background:var(--wrong-bg);
    border-color:var(--wrong);
    color:var(--wrong);
  }

  .score-banner{
    text-align:center;
    font-size:13px;
    color:var(--text-dim);
    margin-top:16px;
  }
  .score-banner b{color:var(--accent);}

  @media (max-width:420px){
    .sheet-grid{grid-template-columns:repeat(8,1fr);}
    .q-sentence{font-size:17px;}
  }
  .nav-toolbar{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
  }
  .nav-toolbar button{
    font:inherit;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);
  }
  .nav-toolbar button:hover{
    color:var(--text);
    border-color:var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>JLPT N1 词汇特训</h1>
    <p>文脉规定 · 300题 · 选后自动解析</p>
    <div class="nav-toolbar">
      <button type="button" onclick="location.href='index.html'">📚语法总览</button>
      <button type="button" onclick="location.href='vocabulary.html'">📖场景词汇</button>
      <button type="button" onclick="location.href='JLPT_Grammar_MindMap_3_0_Ultimate.html'">🗺️导图</button>
    </div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label">
    <span id="progressText">第 1 / 300 题</span>
    <span id="scoreText">已答 0 · 正确 0</span>
  </div>

  <div class="card">
    <div class="q-index" id="qIndex">Q1</div>
    <div class="q-sentence" id="qSentence"></div>
    <div class="options" id="optionsBox"></div>

    <div class="explain" id="explainBox">
      <div class="result-tag" id="resultTag"></div>
      <div id="optExplains"></div>
      <div class="translation">
        <span class="tlabel">句子翻译</span>
        <span id="translationText"></span>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">← 上一题</button>
      <button class="nav-btn primary" id="nextBtn">下一题 →</button>
    </div>
  </div>

  <div class="sheet-toggle">
    <button id="sheetToggleBtn">📋 显示答题卡</button>
  </div>

  <div class="answer-sheet" id="answerSheet">
    <div class="sheet-title">
      <span>答题卡</span>
      <span class="sheet-legend">
        <span><i class="dot ok"></i>正确</span>
        <span><i class="dot no"></i>错误</span>
        <span><i class="dot un"></i>未答</span>
      </span>
    </div>
    <div class="sheet-grid" id="sheetGrid"></div>
  </div>

  <div class="score-banner" id="scoreBanner"></div>
</div>

<script>
const QUESTIONS = [
{w:"遂行",r:"すいこう",s:"彼は与えられた任務を最後まで＿＿＿した。",opts:[
  {k:"遂行",r:"すいこう",m:"执行、完成（任务）——多与「任務・職務」搭配，强调把事情做到底"},
  {k:"履行",r:"りこう",m:"履行（契约、诺言、义务）——常与「契約・約束・義務」搭配"},
  {k:"施行",r:"しこう",m:"施行、实施（法律、制度）——主语通常是法律、政策"},
  {k:"断行",r:"だんこう",m:"断然实行、强行推行——强调克服阻力、不顾一切地做"}
],ans:0,t:"他把交给他的任务坚持执行到了最后。"},

{w:"是正",r:"ぜせい",s:"政府は制度の不備を＿＿＿するための対策を講じた。",opts:[
  {k:"是正",r:"ぜせい",m:"纠正、改正（不正当、不合理之处）——多用于制度、偏差等抽象对象"},
  {k:"訂正",r:"ていせい",m:"订正（文字、数字等具体错误）——如订正错别字、报道内容"},
  {k:"修正",r:"しゅうせい",m:"修正、调整（方案、计划、路线等）——不一定含“错误”之意"},
  {k:"更正",r:"こうせい",m:"更正（官方记录、登记内容等）——多用于行政、法律文书"}
],ans:0,t:"政府采取了对策，以纠正制度上的缺陷。"},

{w:"躊躇",r:"ちゅうちょ",s:"彼女はその申し出を受けるかどうか＿＿＿した。",opts:[
  {k:"躊躇",r:"ちゅうちょ",m:"犹豫、踌躇——因迟疑不决而拿不定主意，最常用"},
  {k:"遠慮",r:"えんりょ",m:"客气、顾虑——出于顾及他人而克制自己的言行"},
  {k:"猶予",r:"ゆうよ",m:"缓期、延期——把事情往后拖延一段时间（名词/动词）"},
  {k:"逡巡",r:"しゅんじゅん",m:"逡巡、迟疑不前——书面语，语气比躊躇更文言"}
],ans:0,t:"她对于是否要接受那个提议犹豫不决。"},

{w:"画期的",r:"かっきてき",s:"この技術は医療の分野において＿＿＿な発見だと言われている。",opts:[
  {k:"画期的",r:"かっきてき",m:"划时代的、开创性的——强调开创新纪元、前所未有"},
  {k:"抜本的",r:"ばっぽんてき",m:"从根本上的（改革、解决）——强调触及根本问题"},
  {k:"飛躍的",r:"ひやくてき",m:"飞跃性的（进步、发展）——强调速度快、跨度大"},
  {k:"革新的",r:"かくしんてき",m:"革新性的、创新的——强调打破旧有方式，带来新事物"}
],ans:0,t:"据说这项技术在医疗领域是一项划时代的发现。"},

{w:"杜撰",r:"ずさん",s:"その報告書は＿＿＿な作りで、誤りが多かった。",opts:[
  {k:"杜撰",r:"ずさん",m:"粗制滥造的、马虎草率的——多用于批评工作、报告不严谨"},
  {k:"粗雑",r:"そざつ",m:"粗糙、粗劣——强调做工不精细"},
  {k:"怠慢",r:"たいまん",m:"怠慢、疏忽职守——强调态度上的懈怠"},
  {k:"疎か",r:"おろそか",m:"疏忽、马虎——多用于「〜をおろそかにする」句型"}
],ans:0,t:"那份报告书制作得非常粗糙草率，错误百出。"},

{w:"愕然",r:"がくぜん",s:"彼はその知らせを聞いて＿＿＿とした。",opts:[
  {k:"愕然",r:"がくぜん",m:"愕然、大吃一惊——因意外冲击而震惊"},
  {k:"呆然",r:"ぼうぜん",m:"茫然、发呆——因震惊或悲伤而脑中一片空白"},
  {k:"憤然",r:"ふんぜん",m:"愤然——因愤怒而情绪激动"},
  {k:"騒然",r:"そうぜん",m:"骚然、喧闹嘈杂——多形容场面、气氛"}
],ans:0,t:"他听到那个消息后感到十分愕然。"},

{w:"由々しい",r:"ゆゆしい",s:"これは看過できない＿＿＿事態だ。",opts:[
  {k:"由々しい",r:"ゆゆしい",m:"事态严重的、不容忽视的——多与「事態」搭配，书面语"},
  {k:"著しい",r:"いちじるしい",m:"显著的、明显的——强调变化或差异很明显"},
  {k:"甚だしい",r:"はなはだしい",m:"极其严重的、过分的——强调程度之深"},
  {k:"喜ばしい",r:"よろこばしい",m:"可喜可贺的——正面含义，与语境相反"}
],ans:0,t:"这是一个不容忽视的严重事态。"},

{w:"几帳面",r:"きちょうめん",s:"彼は＿＿＿な性格で、何事もきっちりこなす。",opts:[
  {k:"几帳面",r:"きちょうめん",m:"一丝不苟、认真细致——强调做事规规矩矩、有条理"},
  {k:"律儀",r:"りちぎ",m:"重情重义、恪守信用——强调对人诚实守约"},
  {k:"生真面目",r:"きまじめ",m:"过分认真、死板认真——略带“不知变通”的语感"},
  {k:"無頓着",r:"むとんちゃく",m:"不在乎、不讲究——与题意相反"}
],ans:0,t:"他性格一丝不苟，任何事情都做得井井有条。"},

{w:"阻害",r:"そがい",s:"過度なストレスは子供の成長を＿＿＿する恐れがある。",opts:[
  {k:"阻害",r:"そがい",m:"阻碍、妨碍（成长、发展等抽象过程）"},
  {k:"妨害",r:"ぼうがい",m:"妨害、干扰——多含“故意打扰”的语感"},
  {k:"阻止",r:"そし",m:"阻止、阻拦——强调制止某具体行为的发生"},
  {k:"障害",r:"しょうがい",m:"障碍（名词）——指阻碍物本身，不能直接接“する”表阻碍动作"}
],ans:0,t:"过度的压力有可能阻碍孩子的成长。"},

{w:"卓越",r:"たくえつ",s:"彼の＿＿＿した技術は多くの人々に評価されている。",opts:[
  {k:"卓越",r:"たくえつ",m:"卓越、出类拔萃——多与「技術・能力」搭配"},
  {k:"優越",r:"ゆうえつ",m:"优越（感）——常用于「優越感」，强调与他人比较后的优势"},
  {k:"秀逸",r:"しゅういつ",m:"秀逸、出众——多形容作品、成果质量出众"},
  {k:"傑出",r:"けっしゅつ",m:"杰出——多形容人才本身杰出"}
],ans:0,t:"他卓越的技术受到了众多人的高度评价。"},

{w:"潜在的",r:"せんざいてき",s:"この製品には＿＿＿な需要があると考えられる。",opts:[
  {k:"潜在的",r:"せんざいてき",m:"潜在的——表面尚未显现，但客观存在"},
  {k:"暫定的",r:"ざんていてき",m:"暂定的——临时性、尚未正式确定"},
  {k:"必然的",r:"ひつぜんてき",m:"必然的——必定会发生"},
  {k:"画一的",r:"かくいつてき",m:"千篇一律的、统一化的"}
],ans:0,t:"人们认为这款产品存在潜在的需求。"},

{w:"妥当",r:"だとう",s:"この結論は科学的に見て＿＿＿だと言える。",opts:[
  {k:"妥当",r:"だとう",m:"妥当、恰当——强调判断、结论合乎情理"},
  {k:"適正",r:"てきせい",m:"适当、恰当合理——多用于价格、数值等是否合理"},
  {k:"正当",r:"せいとう",m:"正当、正统合法——强调符合正义或法理"},
  {k:"順当",r:"じゅんとう",m:"理所当然、合乎常理——多用于比赛结果等符合预期"}
],ans:0,t:"从科学角度来看，可以说这个结论是妥当的。"},

{w:"顕著",r:"けんちょ",s:"最近、若者の消費行動に＿＿＿な変化が見られる。",opts:[
  {k:"顕著",r:"けんちょ",m:"显著的、明显的——多与「変化・傾向」搭配，书面语"},
  {k:"歴然",r:"れきぜん",m:"昭然若揭、显而易见——强调事实清楚到无可争辩"},
  {k:"明白",r:"めいはく",m:"明白、清楚——强调道理或事实一目了然"},
  {k:"漸進的",r:"ぜんしんてき",m:"渐进的——强调变化缓慢、逐步进行，与“显著”语感相反"}
],ans:0,t:"最近可以看到年轻人的消费行为出现了显著的变化。"},

{w:"円滑",r:"えんかつ",s:"会議を＿＿＿に進めるために、事前に資料を配布した。",opts:[
  {k:"円滑",r:"えんかつ",m:"顺利、圆滑无阻——常用于「〜に進める」，指事情推进得顺畅"},
  {k:"円満",r:"えんまん",m:"圆满、和睦——多用于人际关系、协议达成等结果"},
  {k:"順調",r:"じゅんちょう",m:"顺利、进展良好——多形容进度、状况本身"},
  {k:"滑らか",r:"なめらか",m:"光滑、流畅——多形容物理表面或语言表达"}
],ans:0,t:"为了让会议顺利进行，提前分发了资料。"},

{w:"皮肉",r:"ひにく",s:"彼は＿＿＿を込めてそう言った。",opts:[
  {k:"皮肉",r:"ひにく",m:"讽刺、挖苦——话中带刺，暗含批评或嘲讽"},
  {k:"冗談",r:"じょうだん",m:"玩笑——单纯为了逗乐，无恶意"},
  {k:"愚痴",r:"ぐち",m:"牢骚、抱怨——发泄不满情绪"},
  {k:"本音",r:"ほんね",m:"真心话——与场面话相对，不含讽刺意味"}
],ans:0,t:"他带着讽刺的语气说了那句话。"},

{w:"会得",r:"えとく",s:"長年の修行の末、彼はついにその技を＿＿＿した。",opts:[
  {k:"会得",r:"えとく",m:"领会、悟得——通过领悟而彻底理解并掌握（技艺、道理）"},

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null); // null = unanswered, else selected DISPLAYED index

// shuffle each question's option order once so the correct answer isn't always in the same slot
function shuffledOrder(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
let order = QUESTIONS.map(q => shuffledOrder(q.opts.length));

const STORAGE_KEY = "n1_vocab_quiz_progress_v2";
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(saved && Array.isArray(saved.answers) && saved.answers.length === QUESTIONS.length
     && Array.isArray(saved.order) && saved.order.length === QUESTIONS.length){
    answers = saved.answers;
    order = saved.order;
    current = saved.current || 0;
  }
}catch(e){}

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({answers, current, order}));
  }catch(e){}
}

const qIndexEl = document.getElementById("qIndex");
const qSentenceEl = document.getElementById("qSentence");
const optionsBox = document.getElementById("optionsBox");
const explainBox = document.getElementById("explainBox");
const resultTag = document.getElementById("resultTag");
const optExplains = document.getElementById("optExplains");
const translationText = document.getElementById("translationText");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const scoreText = document.getElementById("scoreText");
const sheetToggleBtn = document.getElementById("sheetToggleBtn");
const answerSheet = document.getElementById("answerSheet");
const sheetGrid = document.getElementById("sheetGrid");
const scoreBanner = document.getElementById("scoreBanner");

function buildSheet(){
  sheetGrid.innerHTML = "";
  QUESTIONS.forEach((q,i)=>{
    const cell = document.createElement("div");
    cell.className = "sheet-cell";
    cell.textContent = i+1;
    cell.addEventListener("click", ()=>{ current = i; render(); });
    sheetGrid.appendChild(cell);
  });
}

function updateSheet(){
  const cells = sheetGrid.children;
  for(let i=0;i<QUESTIONS.length;i++){
    const cell = cells[i];
    cell.classList.remove("current","ok","no");
    const a = answers[i];
    if(a !== null){
      cell.classList.add(order[i][a] === QUESTIONS[i].ans ? "ok" : "no");
    }
    if(i === current) cell.classList.add("current");
  }
}

function updateProgress(){
  const answeredCount = answers.filter(a=>a!==null).length;
  const correctCount = answers.filter((a,i)=>a!==null && order[i][a]===QUESTIONS[i].ans).length;
  progressFill.style.width = ((current+1)/QUESTIONS.length*100)+"%";
  progressText.textContent = `第 ${current+1} / ${QUESTIONS.length} 题`;
  scoreText.textContent = `已答 ${answeredCount} · 正确 ${correctCount}`;
  if(answeredCount === QUESTIONS.length){
    scoreBanner.innerHTML = `🎉 全部完成！正确率：<b>${Math.round(correctCount/QUESTIONS.length*100)}%</b>（${correctCount}/${QUESTIONS.length}）`;
  } else {
    scoreBanner.textContent = "";
  }
}

function render(){
  const q = QUESTIONS[current];
  const ord = order[current]; // displayed slot -> original opt index
  qIndexEl.textContent = "Q" + (current+1);
  const selected = answers[current]; // displayed index the user clicked

  qSentenceEl.innerHTML = q.s.replace("＿＿＿", `<span class="blank${selected!==null ? " filled":""}">${selected!==null ? q.opts[q.ans].k : "＿＿＿"}</span>`);

  optionsBox.innerHTML = "";
  ord.forEach((origIdx, dispIdx)=>{
    const opt = q.opts[origIdx];
    const btn = document.createElement("button");
    btn.className = "opt";
    // reading is withheld until an answer is chosen, so it can't be used to guess
    btn.innerHTML = `<span class="label">${String.fromCharCode(65+dispIdx)}</span><span class="kanji">${opt.k}</span>`;
    if(selected !== null){
      btn.classList.add("locked");
      if(origIdx === q.ans) btn.classList.add("correct");
      else if(dispIdx === selected) btn.classList.add("wrong");
      btn.innerHTML += `<span class="reading">（${opt.r}）</span>`;
    }
    btn.addEventListener("click", ()=>{
      if(answers[current] !== null) return;
      answers[current] = dispIdx;
      saveProgress();
      render();
    });
    optionsBox.appendChild(btn);
  });

  if(selected !== null){
    explainBox.classList.add("show");
    const isCorrect = ord[selected] === q.ans;
    resultTag.textContent = isCorrect ? "✓ 回答正确" : "✗ 回答错误";
    resultTag.className = "result-tag " + (isCorrect ? "ok" : "no");
    optExplains.innerHTML = ord.map((origIdx,dispIdx)=>{
      const opt = q.opts[origIdx];
      const isAns = origIdx === q.ans;
      return `<div class="opt-explain${isAns ? " is-answer":""}"><b>${String.fromCharCode(65+dispIdx)}. ${opt.k}（${opt.r}）</b>${isAns ? " ★正解":""} — ${opt.m}</div>`;
    }).join("");
    translationText.textContent = q.t;
  } else {
    explainBox.classList.remove("show");
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === QUESTIONS.length - 1;
  nextBtn.textContent = current === QUESTIONS.length - 1 ? "已是最后一题" : "下一题 →";

  updateSheet();
  updateProgress();
  saveProgress();
}

prevBtn.addEventListener("click", ()=>{ if(current>0){ current--; render(); } });
nextBtn.addEventListener("click", ()=>{ if(current<QUESTIONS.length-1){ current++; render(); } });
sheetToggleBtn.addEventListener("click", ()=>{
  answerSheet.classList.toggle("show");
  sheetToggleBtn.textContent = answerSheet.classList.contains("show") ? "📋 隐藏答题卡" : "📋 显示答题卡";
});

buildSheet();
render();
</script>
